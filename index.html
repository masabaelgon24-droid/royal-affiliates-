<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Royal Affiliates</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ROYAL AFFILIATES — design tokens
   Palette: royal forest green, Ashanti gold, kente red, deep ink.
   The one memorable element is the kente-style strip under the header.
   ===================================================================== */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F2ED; --surface:#FFFFFF; --surface2:#EAE8E0; --ink:#17130F; --muted:#66625A; --line:#DAD7CD;
  --btn:#0A5C36; --green-ink:#0B7A43; --gold:#E0A526; --gold-ink:#8A6206; --red:#B8232F;
  --pill-pending-bg:#FBEFCF; --pill-pending:#7A5604; --pill-ok-bg:#D9F0E2; --pill-ok:#0B5B33; --pill-bad-bg:#F8DADC; --pill-bad:#8E1B25;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1510; --surface:#16211A; --surface2:#1E2C23; --ink:#F2EFE6; --muted:#9AA69D; --line:#2A3A2F;
    --btn:#17834A; --green-ink:#5BD68F; --gold:#F0B93A; --gold-ink:#F0B93A; --red:#E5525C;
    --pill-pending-bg:#3A3010; --pill-pending:#F0C860; --pill-ok-bg:#12351F; --pill-ok:#7BE0A6; --pill-bad-bg:#3D1519; --pill-bad:#F19AA0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1510; --surface:#16211A; --surface2:#1E2C23; --ink:#F2EFE6; --muted:#9AA69D; --line:#2A3A2F;
  --btn:#17834A; --green-ink:#5BD68F; --gold:#F0B93A; --gold-ink:#F0B93A; --red:#E5525C;
  --pill-pending-bg:#3A3010; --pill-pending:#F0C860; --pill-ok-bg:#12351F; --pill-ok:#7BE0A6; --pill-bad-bg:#3D1519; --pill-bad:#F19AA0;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.noscroll{overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:15px;font-weight:600;line-height:1.25}
p{margin:0 0 10px}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- layout ---------- */
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:88px;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.pad{padding:16px 14px 24px}
.sub{color:var(--muted);margin:4px 0 14px}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}

/* ---------- header + kente strip ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.kente{height:6px;background:repeating-linear-gradient(90deg,#E0A526 0 18px,#111 18px 24px,#B8232F 24px 42px,#0F7A43 42px 60px,#111 60px 66px)}
.kente.big{height:14px}
.top .in{display:flex;align-items:center;gap:8px;padding:8px 14px}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font:800 17px "Bricolage Grotesque",Figtree,sans-serif}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-weight:700;font-size:13px}
.avatar{background:var(--btn);color:#fff;border-color:transparent}

/* ---------- bottom tab bar ---------- */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{position:relative;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;
  font-weight:600;font-size:11px;padding:6px 2px;min-height:50px;cursor:pointer;border-radius:12px}
.tab[aria-current="true"]{color:var(--green-ink)}
.tab[aria-current="true"]::before{content:"";position:absolute;top:-7px;left:50%;width:26px;height:3px;margin-left:-13px;background:var(--gold);border-radius:0 0 3px 3px}

/* ---------- buttons, chips, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;
  border:1.5px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-align:center;line-height:1.2}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.primary{background:var(--btn);color:#fff}
.btn.gold{background:var(--gold);color:#1B1408}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--green-ink);font-weight:700;font-size:inherit;cursor:pointer;text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 14px;min-height:38px;
  font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--btn);border-color:var(--btn);color:#fff}
.chip.cur{min-height:34px;padding:0 10px;font-size:13px}
label.lbl{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--ink);font:inherit;font-size:16px}
textarea{resize:vertical;min-height:110px;line-height:1.45}
input[type=range]{padding:0;min-height:36px;accent-color:var(--btn)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--btn)}
.err{color:var(--red);font-weight:600;min-height:20px;margin:8px 0 4px;font-size:14px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.check{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600}
.search{margin:12px 0 0}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.pending,.pill.requested{background:var(--pill-pending-bg);color:var(--pill-pending)}
.pill.approved,.pill.paid,.pill.shipped,.pill.delivered{background:var(--pill-ok-bg);color:var(--pill-ok)}
.pill.rejected{background:var(--pill-bad-bg);color:var(--pill-bad)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);margin:10px 0}
.note{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}

/* ---------- deals grid ---------- */
.hero p{color:var(--muted);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tw{position:relative}
.thumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;padding:7%}
.thumb .emo{font-size:54px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.thumb.sm{width:56px;height:56px;aspect-ratio:auto;border-radius:10px;flex:none}
.thumb.sm .emo{font-size:28px}
.thumb.lg{aspect-ratio:16/10;border-radius:14px;margin-bottom:12px}
.thumb.lg .emo{font-size:76px}
.badge{position:absolute;top:8px;left:8px;display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.badge.free{background:var(--gold);color:#1B1408}
.badge.lock{background:rgba(17,17,17,.82);color:#fff}
.db{padding:10px 10px 6px;flex:1}
.biz{color:var(--muted);font-size:13px;margin:2px 0 8px}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:2px}
.pr span{font-size:12px;color:var(--muted);min-width:52px}
.sell{color:var(--ink);font-size:15px}
.earn{color:var(--green-ink);font-size:15px}
.pr em{font-style:normal;font-size:12px;color:var(--green-ink);font-weight:700}
.da{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:8px 10px 10px}
.da .btn{padding:0 6px}
.box{background:var(--surface2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.box span{font-size:12px;color:var(--muted)}
.box strong{font-size:18px}
.box small{color:var(--green-ink);font-weight:600}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat strong{display:block;font:800 20px "Bricolage Grotesque",Figtree,sans-serif;margin-top:2px;overflow-wrap:anywhere}
.stat.main{grid-column:1/-1;background:var(--btn);border-color:var(--btn);color:#fff}
.stat.main span{color:rgba(255,255,255,.8)}
.stat.main strong{font-size:30px}
.stat.tap{cursor:pointer;text-align:left;font:inherit;color:inherit}

/* ---------- list rows ---------- */
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.li .grow{flex:1;min-width:0}
.li .grow strong{display:block;overflow-wrap:anywhere}
.li small{color:var(--muted)}
.li .end{text-align:right;flex:none}

/* ---------- link-in-bio preview ---------- */
.urlbox{background:var(--surface2);border-radius:12px;padding:12px;font-weight:700;overflow-wrap:anywhere;margin-bottom:10px}
.phone{border:2px solid var(--ink);border-radius:28px;padding:0 0 18px;max-width:340px;margin:8px auto 0;background:var(--surface);overflow:hidden}
.phone .kente{height:8px}
.phone .who{text-align:center;padding:18px 16px 8px}
.phone .av{width:64px;height:64px;border-radius:50%;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;
  font:800 22px "Bricolage Grotesque",Figtree,sans-serif;margin:0 auto 8px}
.phone .who p{color:var(--muted);font-size:14px;margin:4px 0 0}
.ptile{display:flex;align-items:center;gap:10px;margin:8px 14px 0;border:1px solid var(--line);border-radius:14px;padding:8px}
.ptile .grow{flex:1;min-width:0}
.ptile strong{display:block;font-size:14px}

/* ---------- auth ---------- */
.auth .pad{padding-top:22px}
.crownwrap{display:flex;justify-content:center}
.wm{text-align:center;font-size:34px;margin-top:6px}
.slogan{text-align:center;text-transform:uppercase;letter-spacing:.16em;font-weight:700;font-size:13px;color:var(--gold-ink);margin:6px 0 12px}
.lead{text-align:center;color:var(--muted);margin:0 8px 8px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.role{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:4px;min-height:88px}
.role span{font-size:13px;color:var(--muted)}
.role.on{border-color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
.alt{text-align:center;margin:14px 0 6px}
.fine{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}

/* ---------- sheets, toast ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--bg);color:var(--ink);
  border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));outline:none;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet .x{position:absolute;top:12px;right:12px}
.sheet h2.sh{margin-bottom:2px;padding-right:44px}
.plats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.plat{background:var(--surface);border:1.5px solid var(--line);color:var(--ink);border-radius:12px;padding:8px 2px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:11px;line-height:1.15;text-align:center;min-height:74px}
.plat.on{border-color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
.plat .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.plan{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;text-align:left;cursor:pointer;color:var(--ink);min-height:96px}
.plan.on{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.plan strong{display:block;font:800 17px "Bricolage Grotesque",Figtree,sans-serif}
.perks{padding-left:20px;margin:8px 0}
.perks li{margin:4px 0}
.emos{display:flex;gap:6px;flex-wrap:wrap}
.emos button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer}
.emos button.on{border-color:var(--btn);box-shadow:inset 0 0 0 1.5px var(--btn)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold);width:22px;border-radius:9px}
.stepic{width:68px;height:68px;border-radius:50%;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;margin:8px auto 14px}
.tut{text-align:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(92%,420px);
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;display:none;text-align:center}
#toast.show{display:block}
.track{display:flex;gap:6px;margin:8px 0 2px}
.track i{flex:1;height:6px;border-radius:9px;background:var(--surface2)}
.track i.on{background:var(--btn)}
.rank{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.li.me{border-color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
/* ---------- Royal packages ---------- */
.crowns{display:inline-flex;gap:2px;align-items:center}
.pk{border:1.5px solid var(--line);border-left:6px solid var(--c);background:var(--surface);border-radius:14px;padding:12px 12px 12px 14px;margin:12px 0}
.pk.on{box-shadow:inset 0 0 0 1.5px var(--c)}
.pkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pkh h3{font-size:19px;font-weight:800;flex:1;min-width:0}
.pkp{margin:6px 0 2px}
.pkp strong{font:800 26px "Bricolage Grotesque",Figtree,sans-serif}
.pkl{margin:2px 0 10px}
.pkw{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column}
.pkw span{font-size:12px;color:var(--muted)}
.pkw strong{font-size:20px}
.pkw small{color:var(--muted)}
.notice{background:var(--pill-pending-bg);color:var(--pill-pending);border-radius:12px;padding:10px 12px;margin:10px 0}
.notice p{margin:2px 0 8px}
.rankcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--gold));border-radius:14px;padding:12px;margin:0 0 14px}
.rankcard>div{flex:1;min-width:0}
.rankcard strong{display:block;font:800 18px "Bricolage Grotesque",Figtree,sans-serif}
.rankcard small{color:var(--muted)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step output{min-width:24px;text-align:center;font-weight:700}
.stepb{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:700 20px/1 Figtree,sans-serif;cursor:pointer}
.pkcount{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;font-weight:700;border-bottom:1px solid var(--line);margin-bottom:10px}
.pkcount.ok{color:var(--green-ink)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

   The owner pastes the real settings here once (see the setup guide). These values are public by design. */
window.ROYAL_FIREBASE = window.ROYAL_FIREBASE || {
  apiKey: "AIzaSyDpCUqMumfNmhN5QkANYFFTfcPRFxCMEPE",
  authDomain: "royal-affiliates-ca002.firebaseapp.com",
  projectId: "royal-affiliates-ca002",
  storageBucket: "royal-affiliates-ca002.firebasestorage.app",
  messagingSenderId: "440587323449",
  appId: "1:440587323449:web:50138a11f3cb6632dc65e8"
};
</script>
<script type="module">
/* Thin adapter: the only place that talks to the Firebase SDK. */
const cfg = window.ROYAL_FIREBASE;
if (!window.FB && cfg && cfg.apiKey){
  try{
    const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [app, auth, fs] = await Promise.all([import(B + 'firebase-app.js'), import(B + 'firebase-auth.js'), import(B + 'firebase-firestore.js')]);
    const a = app.initializeApp(cfg), au = auth.getAuth(a), db = fs.getFirestore(a);
    const rows = s => s.docs.map(d => Object.assign({}, d.data(), { id: d.id }));
    window.FB = {
      onAuth: cb => auth.onAuthStateChanged(au, u => cb(u ? { uid:u.uid, email:u.email } : null)),
      signUp: async (e, p) => { const c = await auth.createUserWithEmailAndPassword(au, e, p); return { uid:c.user.uid, email:c.user.email }; },
      signIn: async (e, p) => { const c = await auth.signInWithEmailAndPassword(au, e, p); return { uid:c.user.uid, email:c.user.email }; },
      signOut: () => auth.signOut(au),
      resetPw: e => auth.sendPasswordResetEmail(au, e),
      watch: (spec, cb, onErr) => {
        if (spec.doc){ return fs.onSnapshot(fs.doc(db, spec.doc[0], spec.doc[1]), s => cb(s.exists() ? [Object.assign({}, s.data(), { id: s.id })] : []), onErr); }
        let q = fs.collection(db, spec.col);
        if (spec.where) q = fs.query(q, fs.where(spec.where[0], spec.where[1], spec.where[2]));
        return fs.onSnapshot(q, s => cb(rows(s)), onErr);
      },
      set: (col, id, data) => fs.setDoc(fs.doc(db, col, id), data),
      update: (col, id, data) => fs.updateDoc(fs.doc(db, col, id), data),
      remove: (col, id) => fs.deleteDoc(fs.doc(db, col, id)),
      batch: async list => { for (let i = 0; i < list.length; i += 8){ const b = fs.writeBatch(db); list.slice(i, i + 8).forEach(x => b.set(fs.doc(db, x.col, x.id), x.data)); await b.commit(); } }
    };
    window.dispatchEvent(new Event('fb-ready'));
  }catch(e){ window.FB_ERROR = String(e && e.message || e); window.dispatchEvent(new Event('fb-error')); }

function calc(){
  const mo = S.orders.filter(o => o.cid === 'me'), ms = S.submissions.filter(s => s.cid === 'me');
  const sum = (st) => mo.filter(o => o.st === st).reduce((a, o) => a + o.amt, 0) + ms.filter(s => s.st === st).reduce((a, s) => a + subEarn(s), 0);
  const earned = sum('approved'), pending = sum('pending');
  const mw = S.withdrawals.filter(w => w.cid === 'me');
  const withdrawn = mw.reduce((a, w) => a + w.amt, 0);
  const paid = mw.filter(w => w.st === 'paid').reduce((a, w) => a + w.amt, 0);
  return { earned, pending, withdrawn, paid, available: Math.max(0, earned - withdrawn), orders: mo.length, collabo: ms.reduce((a, s) => s.st === 'rejected' ? a : a + subEarn(s), 0) };
}

function copyText(text){
  return new Promise(res => {
    const fb = () => { try{ const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); res(!!ok); }catch(e){ res(false); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => res(true), fb); else fb();
  });
}

function fileToThumb(file, cb){
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 360 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * k)); c.height = Math.max(1, Math.round(im.height * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .72)); }; im.onerror = () => toast('That image could not be read.'); im.src = r.result; };
  r.readAsDataURL(file);
}

function act(a, d, el, e){
  switch (a){
    /* --- global --- */
    case 'closeov': if (e.target === el) closeSheet(); break;
    case 'close': closeSheet(); break;
    case 'cur': S.cur = S.cur === 'UGX' ? 'USD' : 'UGX'; commit(); if ($('.sheet')) menuSheet(); break;
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; commit(); if ($('.sheet')) menuSheet(); break;
    case 'menu': menuSheet(); break;
    case 'tab': S.tab = d.v; closeSheet(); commit(false); break;
    case 'logout': if (CLOUD.on){ closeSheet(); FB.signOut(); break; } closeSheet(); S.session = false; A = { mode:'login', role:'creator', vals:{ email:S.user ? S.user.email : '' } }; commit(false); break;
    case 'reset': { const u = S.user, keep = { theme:S.theme, cur:S.cur }; S = fresh(keep); u.pkg = null; S.user = u; S.session = true; S.tab = TABS[u.role][0][0]; if (u.role === 'creator') seedMine(); closeSheet(); commit(false); toast('Demo data reset.'); break; }
    case 'forgot': { const em = val('f-email'); if (!em){ $('#auth-err').textContent = 'Type your email first.'; break; } FB.resetPw(em).then(() => toast('Check your email for a reset link.')).catch(e => { const x = $('#auth-err'); if (x) x.textContent = authMsg(e); }); break; }
    case 'claimask': sheet('<h2 class="sh">Claim owner access</h2><p>Only the House of Wellness owner should do this. The first person to tap the button below becomes the owner, for good. Do it yourself before you share the app link with anyone.</p><button class="btn primary block" data-a="claimowner">Yes, I am the owner</button><button class="btn ghost block" data-a="close" style="margin-top:8px">Cancel</button>'); break;
    case 'claimowner': closeSheet(); claimOwner(); break;
    case 'seedcat': seedCatalog().then(() => toast('The OQATA products are loaded.')).catch(cloudErr); break;
    case 'switchrole': { const u = S.user; u.role = u.role === 'business' ? 'creator' : 'business'; if (u.role === 'creator') ensureMine(); S.tab = TABS[u.role][0][0]; closeSheet(); commit(false); toast('Now in ' + (u.role === 'creator' ? 'affiliate' : 'business') + ' view.'); break; }

    /* --- auth --- */
    case 'role': A.vals = { name:val('f-name'), email:val('f-email'), phone:val('f-phone') }; A.role = d.v; render(); break;
    case 'authmode': A.vals = { email:val('f-email') }; A.mode = d.v; render(); break;
    case 'signup': {
      const name = val('f-name'), email = val('f-email'), phone = val('f-phone'), err = $('#auth-err');
      if (name.length < 2) return err.textContent = 'Enter your ' + (A.role === 'business' ? 'business name.' : 'name.');
      if (!/^\S+@\S+\.\S+$/.test(email)) return err.textContent = 'Enter a valid email, like you@example.com.';
      if (phone.replace(/\D/g, '').length < 9) return err.textContent = 'Enter your phone number with at least 9 digits.';
      if (CLOUD.on) return cloudSignup(name, email, phone, val('f-pass'), err);
      S = fresh({ theme:S.theme, cur:S.cur });
      S.user = { id:'me', name, email, phone, role:A.role, pkg:null, joined:Date.now() };
      S.session = true; S.link.handle = slug(name);
      if (A.role === 'creator'){ seedMine(); S.tab = 'deals'; } else S.tab = 'bhome';
      commit(false);
      if (A.role === 'creator'){ TU = 0; tutSheet(); }
      break;
    }
    case 'login': {
      const email = val('f-email').toLowerCase(), err = $('#auth-err');
      if (CLOUD.on) return cloudLogin(email, val('f-pass'), err);
      if (S.user && S.user.email.toLowerCase() === email){ S.session = true; commit(false); }
      else err.textContent = 'No account with that email on this device. Create one instead.';
      break;
    }

    /* --- deals + share --- */
    case 'filter': S.filter = d.v; commit(); break;
    case 'detail': detailSheet(d.id); break;
    case 'share': shareSheet(d.id, 'whatsapp'); break;
    case 'plat': shareSheet(SH.id, d.v); break;
    case 'doshare': doShare(); break;
    case 'sub': pkgSheet(); break;
    case 'pkgpick': pkgReqSheet(d.v); break;
    case 'pkqty': { const q = Math.max(0, (PK.qty[d.id] || 0) + Number(d.v)); if (q) PK.qty[d.id] = q; else delete PK.qty[d.id]; const o = $('#q-' + d.id); if (o) o.textContent = q; pkUpdate(); break; }
    case 'dopkg': {

    }
    case 'cancelpkg': del('pkgReqs', d.id); commit(); pkgSheet(); toast('Request cancelled.'); break;
    case 'pkgok': case 'pkgno': {
      const r = S.pkgReqs.find(x => x.id === d.id); if (!r) break;
      upd('pkgReqs', r.id, { st: a === 'pkgok' ? 'approved' : 'rejected' });
      if (a === 'pkgok' && CLOUD.on) givePkg(r);
      if (a === 'pkgok' && r.cid === 'me' && rankIdx(r.pkg) > (S.user.pkg ? rankIdx(S.user.pkg) : -1)) S.user.pkg = r.pkg;
      commit(); toast(a === 'pkgok' ? 'Package approved.' : 'Package request rejected.'); break;
    }
    case 'tutorial': TU = 0; tutSheet(); break;
    case 'tut': if (d.v === 'done'){ S.tutorialSeen = true; save(); closeSheet(); } else { TU = Math.max(0, Math.min(TUT.length - 1, TU + Number(d.v))); tutSheet(); } break;

    /* --- collabo --- */
    case 'cdetail': cdetailSheet(d.id); break;
    case 'csubmit': csubmitSheet(d.id); break;
    case 'dosubmit': {
      const k = val('c-camp'), url = val('c-url'), views = num(val('c-views')), err = $('#c-err');
      if (!/^https?:\/\/\S{4,}/i.test(url)) return err.textContent = 'Paste the full link to your post, starting with https://';
      ins('submissions', { id:uid('s'), camp:k, cid:'me', by:S.user.name, plat:val('c-plat'), url, views, st:'pending', t:Date.now() });
      closeSheet(); S.tab = 'collabo'; commit(); toast('Sent. You are paid once the business approves your views.'); break;
    }
    case 'upviews': { const s = S.submissions.find(x => x.id === d.id);
      sheet(`<h2 class="sh">Update views</h2><p class="sub">Enter the views your post has now. The business will check them again.</p><label class="lbl" for="u-views">Views now</label><input id="u-views" type="number" inputmode="numeric" min="0" value="${s.views}"><button class="btn primary block" data-a="saveviews" data-id="${s.id}" style="margin-top:14px">Save views</button>`); break; }
    case 'saveviews': { const s = S.submissions.find(x => x.id === d.id); upd('submissions', s.id, { views:num(val('u-views')), st:'pending' }); closeSheet(); commit(); toast('Views updated. Waiting for approval.'); break; }

    /* --- my link --- */
    case 'addlink': addLinkSheet(); break;
    case 'togglelink': { const a2 = S.link.productIds, i = a2.indexOf(d.id); if (i > -1) a2.splice(i, 1); else a2.push(d.id); commit(); addLinkSheet(); break; }
    case 'rmlink': S.link.productIds = S.link.productIds.filter(x => x !== d.id); commit(); break;
    case 'addlinkfrom': if (!S.link.productIds.includes(d.id)) S.link.productIds.push(d.id); closeSheet(); commit(); toast('Added to your link page.'); break;
    case 'copybio': copyText('https://' + SITE + '/@' + handle()).then(ok => toast(ok ? 'Link copied. Paste it in your bio.' : 'Could not copy. Press and hold the link to copy it.')); break;
    case 'edithandle':
      sheet(`<h2 class="sh">Your link page</h2><label class="lbl" for="h-handle">Link name</label><input id="h-handle" value="${esc(handle())}" maxlength="20" autocapitalize="off"><p class="hint">${SITE}/@yourname</p><label class="lbl" for="h-bio">Short bio</label><textarea id="h-bio" rows="3" maxlength="140">${esc(S.link.bio)}</textarea><button class="btn primary block" data-a="savehandle" style="margin-top:14px">Save</button>`); break;
    case 'savehandle': S.link.handle = slug(val('h-handle')); S.link.bio = val('h-bio'); closeSheet(); commit(); break;
    case 'buy': { const p = prod(d.id);
      sheet(`<h2 class="sh">${CLOUD.on ? 'Record an order' : 'Demo checkout'}</h2><p class="sub">${CLOUD.on ? 'Enter the buyer details for ' + esc(p.name) + '. The House of Wellness team will confirm the order.' : 'You are the buyer here. This records an order for ' + esc(p.name) + ' on your earnings page.'}</p><label class="lbl" for="b-name">Buyer name</label><input id="b-name" placeholder="Buyer name"><label class="lbl" for="b-phone">Buyer phone</label><input id="b-phone" type="tel" placeholder="+256 7XX XXX XXX"><label class="lbl" for="b-place">Delivery place</label><input id="b-place" placeholder="Town or area"><label class="lbl" for="b-qty">Quantity</label><input id="b-qty" type="number" min="1" max="10" value="1"><button class="btn primary block" data-a="dobuy" data-id="${p.id}" style="margin-top:14px">Place order for ${money(p.price)}</button>`); break; }
    case 'dobuy': { const p = prod(d.id), q = Math.max(1, Math.min(10, num(val('b-qty')) || 1));
      ins('orders', { id:uid('o'), pid:p.id, cid:'me', by:S.user.name, buyer:val('b-name') || 'Guest buyer', bphone:val('b-phone'), place:val('b-place'), qty:q, amt:p.comm * q, st:'pending', t:Date.now() });
      S.clicks++; closeSheet(); commit(); toast('Order recorded. See it under Earnings.'); break; }

    /* --- earnings + samples --- */
    case 'withdraw': withdrawSheet(); break;
    case 'dowithdraw': {
      const amt = num(val('w-amt')), c = calc(), acct = val('w-acct'), err = $('#w-err');
      if (amt < 20000) return err.textContent = 'The minimum withdrawal is ' + ugx(20000) + '.';
      if (amt > c.available) return err.textContent = 'You can withdraw up to ' + ugx(c.available) + ' right now.';
      if (acct.length < 5) return err.textContent = 'Enter where we should send the money.';
      ins('withdrawals', { id:uid('w'), cid:'me', by:S.user.name, amt, method:val('w-method'), acct, st:'pending', t:Date.now() });
      closeSheet(); commit(); toast('Withdrawal requested. The business will confirm it.'); break;
    }
    case 'simulate': {
      const pool = S.link.productIds.map(prod).filter(Boolean), list = pool.length ? pool : S.products.filter(p => p.free), p = list[Math.floor(Math.random() * list.length)];
      S.orders.push({ id:uid('o'), pid:p.id, cid:'me', by:S.user.name, buyer:['Naomi K.','Peter S.','Esther B.','Moses T.'][Math.floor(Math.random() * 4)], qty:1, amt:p.comm, st:'pending', t:Date.now() });
      S.clicks += 3 + Math.floor(Math.random() * 6); commit(); toast('Demo order added: ' + p.name); break;
    }
    case 'reqsample': { const p = prod(d.id);
      sheet(`<h2 class="sh">Request a sample</h2><p class="sub">${esc(p.name)} from ${esc(p.biz)}. Free, and you agree to post a video about it.</p><label class="lbl" for="s-place">Delivery area</label><input id="s-place" placeholder="Kampala, Ntinda"><label class="lbl" for="s-phone">Phone for the courier</label><input id="s-phone" type="tel" value="${esc(S.user.phone || '')}"><div class="err" id="s-err" role="alert"></div><button class="btn primary block" data-a="dosample" data-id="${p.id}">Request free sample</button>`); break; }
    case 'dosample': { const place = val('s-place'), phone = val('s-phone'), err = $('#s-err');
      if (place.length < 3) return err.textContent = 'Enter the area we should deliver to.';
      if (phone.replace(/\D/g, '').length < 9) return err.textContent = 'Enter a phone number for delivery.';
      ins('samples', { id:uid('m'), pid:d.id, cid:'me', by:S.user.name, place, phone, st:'requested', t:Date.now() });
      closeSheet(); S.tab = 'samples'; commit(false); toast('Sample requested.'); break; }

    /* --- business --- */
    case 'newprod': newProdSheet(); break;
    case 'emo': PEMO = d.v; document.querySelectorAll('#emos button').forEach(b => b.classList.toggle('on', b.dataset.v === PEMO)); break;
    case 'saveprod': {
      const name = val('n-name'), price = num(val('n-price')), comm = num(val('n-comm')), err = $('#n-err');
      if (name.length < 2) return err.textContent = 'Enter the product name.';
      if (price < 1000) return err.textContent = 'Enter a selling price in UGX.';
      if (comm < 1 || comm >= price) return err.textContent = 'The affiliate earnings must be more than 0 and less than the price.';
      const pal = PAL[S.products.length % PAL.length];
      ins('products', { ord:-Date.now(), id:uid('p'), name, biz:S.user.name, cat:val('n-cat'), price, comm, free:$('#n-free').checked, emoji:PEMO, c1:pal[0], c2:pal[1], img:PIMG, desc:val('n-desc') || 'New product on Royal Affiliates.' }, true);
      closeSheet(); commit(); toast('Product added.'); break;
    }
    case 'toggleprod': { const p = prod(d.id); p.free = !p.free; commit(); break; }
    case 'delprod': del('products', d.id); S.link.productIds = S.link.productIds.filter(x => x !== d.id); commit(); toast('Product removed.'); break;
    case 'newcamp': newCampSheet(); break;
    case 'savecamp': {
      const title = val('k-title'), budget = num(val('k-budget')), rate = num(val('k-rate')), err = $('#k-err'), plats = [...document.querySelectorAll('.k-plat:checked')].map(x => x.value);
      if (title.length < 3) return err.textContent = 'Give the campaign a title.';
      if (budget < 10000 || rate < 500) return err.textContent = 'Enter a budget and a pay rate per 1,000 views.';
      if (rate > budget) return err.textContent = 'The pay rate cannot be more than the budget.';
      if (!plats.length) return err.textContent = 'Pick at least one platform.';
      const pal = PAL[S.campaigns.length % PAL.length];
      ins('campaigns', { ord:-Date.now(), id:uid('k'), title, biz:S.user.name, rate, budget, plats, emoji:'📣', c1:pal[0], c2:pal[1], brief:val('k-brief') || 'Post about our brand and share your link.', rules:val('k-rules').split('\n').map(x => x.trim()).filter(Boolean) }, true);
      closeSheet(); commit(); toast('Campaign launched.'); break;
    }
    case 'review': reviewSheet(d.id); break;
    case 'subok': case 'subno': { const s = S.submissions.find(x => x.id === d.id); upd('submissions', s.id, { st: a === 'subok' ? 'approved' : 'rejected' }); commit(); reviewSheet(d.c); break; }
    case 'ordok': upd('orders', d.id, { st:'approved' }); commit(); break;
    case 'ordall': S.orders.filter(o => o.st === 'pending').forEach(o => upd('orders', o.id, { st:'approved' })); commit(); toast('All pending orders approved.'); break;
    case 'sampst': { const s = S.samples.find(x => x.id === d.id); upd('samples', s.id, { st: s.st === 'requested' ? 'shipped' : 'delivered' }); commit(); break; }
    case 'payok': upd('withdrawals', d.id, { st:'paid' }); commit(); toast('Marked as paid.'); break;
  }
}

/* ---------- 6b. shared database (Firebase) ---------- */
function authMsg(e){
  const c = (e && e.code) || '';
  if (c === 'auth/email-already-in-use') return 'That email already has an account. Log in instead.';
  if (c === 'auth/invalid-email') return 'Enter a valid email, like you@example.com.';
  if (c === 'auth/weak-password') return 'Choose a password with at least 6 characters.';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-login-credentials') return 'Wrong email or password.';
  if (c === 'auth/network-request-failed') return 'No internet. Try again.';
  if (c === 'auth/unauthorized-domain') return 'This web address is not approved yet. In Firebase, open Authentication, Settings, Authorized domains and add it.';
  if (c === 'auth/too-many-requests') return 'Too many tries. Wait a little and try again.';
  return 'Something went wrong. Try again.';
}
function stopSubs(){ CLOUD.subs.concat(CLOUD.dataSubs).forEach(f => { try{ f(); }catch(e){} }); CLOUD.subs = []; CLOUD.dataSubs = []; }
function cloudBoot(){
  FB.onAuth(u => {
    stopSubs();
    if (!u){
      CLOUD.uid = null; CLOUD.profile = null; CLOUD.owner = undefined; CLOUD.loading = false;
      S = fresh(pickUi(S)); A = { mode:'login', role:'creator', vals:{} }; render(false); return;
    }
    CLOUD.uid = u.uid; CLOUD.email = u.email || ''; CLOUD.loading = true; CLOUD.owner = undefined; CLOUD.profile = null;
    watchAll();
  });
}
function watchAll(){
  const me = CLOUD.uid, w = (spec, cb) => CLOUD.subs.push(FB.watch(spec, cb, e => console.error(e)));
  w({ doc:['config','owner'] }, L => { const o = L[0] ? L[0].uid : null, was = CLOUD.owner; CLOUD.owner = o; if (was !== o) watchData(); applyUser(); });
  w({ doc:['users', me] }, L => {
    if (L[0]){ CLOUD.profile = L[0]; applyUser(); }
    else if (!CLOUD.creating){ FB.set('users', me, { name:(CLOUD.email.split('@')[0] || 'Affiliate'), email:CLOUD.email, phone:'', pkg:null, createdAt:Date.now() }).catch(cloudErr); }
  });
  w({ col:'products' }, L => { S.products = L.sort((a, b) => (a.ord || 0) - (b.ord || 0)); render(); });
  w({ col:'campaigns' }, L => { S.campaigns = L.sort((a, b) => (a.ord || 0) - (b.ord || 0)); render(); });
}
function watchData(){
  CLOUD.dataSubs.forEach(f => { try{ f(); }catch(e){} }); CLOUD.dataSubs = [];
  const owner = ownerNow();
  ['orders','pkgReqs','withdrawals','submissions','samples'].forEach(col => {
    const spec = owner ? { col } : { col, where:['cid', '==', CLOUD.uid] };
    CLOUD.dataSubs.push(FB.watch(spec, L => { S[col] = L.map(fromDoc); render(); }, e => console.error(e)));
  });
  if (owner) CLOUD.dataSubs.push(FB.watch({ col:'users' }, L => { S.users = L; }, e => console.error(e)));
}
function applyUser(){
  const p = CLOUD.profile;
  if (!p || CLOUD.owner === undefined) return;
  const first = !S.user || !S.session, isO = CLOUD.owner === CLOUD.uid;
  S.user = { id:'me', name:p.name, email:p.email || CLOUD.email, phone:p.phone || '', role: isO ? 'business' : 'creator', pkg:p.pkg || null, joined:p.createdAt || Date.now() };
  S.session = true; CLOUD.loading = false;
  if (S.link.uid !== CLOUD.uid){ S.link = Object.assign({}, fresh().link, { handle:slug(S.user.name), uid:CLOUD.uid }); S.clicks = 0; }
  if (first){ S.tab = TABS[S.user.role][0][0]; render(false); if (!isO && !S.tutorialSeen){ TU = 0; tutSheet(); } }
  else render();
}
async function cloudSignup(name, email, phone, pass, err){
  if (pass.length < 6) return err.textContent = 'Choose a password with at least 6 characters.';
  err.textContent = 'Creating your account...'; CLOUD.creating = true;
  try{
    const u = await FB.signUp(email, pass);
    await FB.set('users', u.uid, { name, email, phone, pkg:null, createdAt:Date.now() });
  }catch(e){ const x = $('#auth-err'); if (x) x.textContent = authMsg(e); }
  finally{ CLOUD.creating = false; }
}
async function cloudLogin(email, pass, err){
  if (!email || !pass) return err.textContent = 'Enter your email and password.';
  err.textContent = 'Logging in...';
  try{ await FB.signIn(email, pass); }catch(e){ const x = $('#auth-err'); if (x) x.textContent = authMsg(e); }
}
async function seedCatalog(){
  const items = seedProducts().map((p, i) => ({ col:'products', id:p.id, data:clean(Object.assign({}, p, { ord:i })) }))
    .concat(seedCampaigns().map((k, i) => ({ col:'campaigns', id:k.id, data:clean(Object.assign({}, k, { ord:i })) })));
  await FB.batch(items);
}
async function claimOwner(){
  try{
    await FB.set('config', 'owner', { uid:CLOUD.uid, email:CLOUD.email, t:Date.now() });
    await seedCatalog();
    toast('You are now the owner. The OQATA products are loaded.');
  }catch(e){ cloudErr(e); }
}
function givePkg(r){
  const tgt = r.cid === 'me' ? CLOUD.uid : r.cid, cur = S.users.find(x => x.id === tgt);
  if (!cur || rankIdx(r.pkg) > (cur.pkg ? rankIdx(cur.pkg) : -1)) FB.update('users', tgt, { pkg:r.pkg }).catch(cloudErr);
}
function cloudMenu(b){
  if (b) return S.products.length ? '' : '<button class="btn gold block" data-a="seedcat">Load the 16 OQATA products</button>';
  return CLOUD.owner === null ? '<button class="btn gold block" data-a="claimask">I am the House of Wellness owner</button>' : '';
}

/* ---------- 7. boot ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) act(el.dataset.a, el.dataset, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ S.q = t.value; const l = $('#dealList'); if (l) l.innerHTML = dealCards(); }
  if (t.id === 'calc-range'){ const v = Number(t.value); $('#calc-out').textContent = money(v / 1000 * Number(t.dataset.rate)); $('#calc-views').textContent = v.toLocaleString('en-US') + ' views'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'w-method'){ const l = $('#w-acct-l'); if (l) l.textContent = METHODS[t.value]; }
  if (t.id === 'pimg' && t.files && t.files[0]) fileToThumb(t.files[0], url => { PIMG = url; const s = $('#pimg-s'); if (s) s.textContent = 'Photo added. It will replace the emoji.'; });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.sheet')) closeSheet(); });
if (window.matchMedia) { try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'auto') render(); }); }catch(e){} }

if (CLOUD.on){
  const go = () => cloudBoot();
  if (window.FB) go();
  else {
    window.addEventListener('fb-ready', go, { once:true });
    window.addEventListener('fb-error', () => { CLOUD.loading = false; CLOUD.error = window.FB_ERROR || 'error'; render(false); }, { once:true });
  }
}
render(false);
})();
